name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  generate-checksums:
    name: Generate Go checksums
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate go.sum
        run: |
          go mod tidy
          test -s go.sum

      - name: Upload go.sum and go.mod
        uses: actions/upload-artifact@v4
        with:
          name: generated-go-sum
          path: |
            go.sum
            go.mod
          if-no-files-found: error

  test:
    name: Test
    needs: generate-checksums
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated checksums
        uses: actions/download-artifact@v4
        with:
          name: generated-go-sum
          path: .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -mod=readonly ./...

  build:
    name: Build
    needs: generate-checksums
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated checksums
        uses: actions/download-artifact@v4
        with:
          name: generated-go-sum
          path: .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -mod=readonly ./...

  xcaddy:
    name: Build with xcaddy
    needs: generate-checksums
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated checksums
        uses: actions/download-artifact@v4
        with:
          name: generated-go-sum
          path: .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build latest Caddy with provider
        run: |
          "$(go env GOPATH)/bin/xcaddy" build \
            --with github.com/SodaWithoutSparkles/caddy-dns-http-acme=.

      - name: Check Caddy build
        run: ./caddy version
