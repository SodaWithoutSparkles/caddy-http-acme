name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  generate-checksums:
    name: Generate Go module files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate go.mod and go.sum
        run: |
          go mod tidy
          test -s go.mod
          test -s go.sum

      - name: Upload Go module files
        uses: actions/upload-artifact@v4
        with:
          name: go-module-files
          path: |
            go.mod
            go.sum
          if-no-files-found: error

  test:
    name: Test
    needs: generate-checksums
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Go module files
        uses: actions/download-artifact@v4
        with:
          name: go-module-files
          path: .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -mod=readonly ./...

  build:
    name: Build
    needs: generate-checksums
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Go module files
        uses: actions/download-artifact@v4
        with:
          name: go-module-files
          path: .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -mod=readonly ./...

  xcaddy:
    name: Build with xcaddy
    needs: generate-checksums
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Go module files
        uses: actions/download-artifact@v4
        with:
          name: go-module-files
          path: .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy with provider
        run: |
          "$(go env GOPATH)/bin/xcaddy" build \
            --with github.com/SodaWithoutSparkles/caddy-http-acme=.

      - name: Check Caddy build
        run: ./caddy version

  # Release lives in release.yml: a push to main that changes version.txt
  # triggers a tagged release build.