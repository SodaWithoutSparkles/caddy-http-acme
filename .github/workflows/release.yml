name: Release

# Triggered by a push to main that changes version.txt (the version source of
# truth). Bumping version.txt to X.Y.Z creates the tag vX.Y.Z, builds Caddy
# with this provider, and publishes a GitHub release with the binary.
on:
  push:
    branches:
      - main
      - master
    paths:
      - version.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history and tags: git-cliff needs previous tags to scope the
          # changelog to commits since the last release.
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          ver="$(tr -d '[:space:]' < version.txt)"
          if [ -z "$ver" ]; then
            echo "::error::version.txt is empty"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Check tag does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists; bump version.txt"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists; bump version.txt"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate go.mod and go.sum
        run: |
          go mod tidy
          test -s go.mod
          test -s go.sum

      - name: Run tests
        run: go test -mod=readonly ./...

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy
        run: |
          "$(go env GOPATH)/bin/xcaddy" build \
            --with github.com/SodaWithoutSparkles/caddy-http-acme=.

      - name: Rename binary
        run: mv caddy "caddy-${{ steps.version.outputs.tag }}-linux-amd64"

      - name: Generate checksum
        run: |
          sha256sum "caddy-${{ steps.version.outputs.tag }}-linux-amd64" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caddy-${{ steps.version.outputs.tag }}-linux-amd64
          path: |
            caddy-${{ steps.version.outputs.tag }}-linux-amd64
            SHA256SUMS
          if-no-files-found: error

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate Changelog
        env:
          CURRENT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          # Must stay in sync with tag_pattern in cliff.toml.
          release_tag='^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'

          if [[ ! "$CURRENT_TAG" =~ $release_tag ]]; then
            echo "::error::version.txt tag '$CURRENT_TAG' does not match $release_tag"
            exit 1
          fi

          # Prereleases get the delta from the previous prerelease, stable
          # releases from the previous stable release. Two independent streams.
          if [[ "$CURRENT_TAG" == *-* ]]; then
            want_pre=true
          else
            want_pre=false
          fi

          previous=""
          while IFS= read -r tag; do
            if [[ ! "$tag" =~ $release_tag ]]; then
              continue
            fi
            if [ "$tag" = "$CURRENT_TAG" ]; then
              continue
            fi
            if ! git merge-base --is-ancestor "$tag" HEAD; then
              continue
            fi
            if [[ "$tag" == *-* ]]; then
              is_pre=true
            else
              is_pre=false
            fi
            if [ "$is_pre" = "$want_pre" ]; then
              # A same-class tag that is newer than the version being released
              # means version.txt went backwards.
              if [ "$(printf '%s\n%s\n' "$CURRENT_TAG" "$tag" | sort -V | tail -n1)" = "$tag" ]; then
                echo "::error::tag $tag is newer than $CURRENT_TAG; is version.txt correct?"
                exit 1
              fi
              previous="$tag"
              break
            fi
          done < <(git tag --list --sort=-v:refname)

          if [ -n "$previous" ]; then
            echo "Changelog range: $previous..HEAD"
            git-cliff \
              --config cliff.toml \
              "$previous..HEAD" \
              --tag "$CURRENT_TAG" \
              --output CHANGELOG.md
          else
            echo "No previous tag in this release class; using full history"
            git-cliff \
              --config cliff.toml \
              --tag "$CURRENT_TAG" \
              --output CHANGELOG.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --notes-file CHANGELOG.md \
            "caddy-${{ steps.version.outputs.tag }}-linux-amd64" \
            SHA256SUMS
