[changelog]
header = "## What's Changed\n\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}⚠️ {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
    {% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "⚙️ Refactoring" },
  { message = "^docs", group = "📚 Documentation" },
  { message = "^test", group = "🧪 Tests" },
  { message = "^build|^ci", group = "🛠️ Build & CI" },
  # Version bump commits carry no changelog value; skip them.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "🧰 Maintenance" },
  { message = ".*", group = "⚙️ Other Changes" },
]
filter_commits = false
# Anchored: git-cliff matches unanchored, so "v[0-9].*" would also treat
# stray tags like "v-backup" as releases.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'